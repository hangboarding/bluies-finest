<title>Bluies Finest Tour</title>

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: a phone on the left plays the app; the step list on the right is the script. Stacks on phones. */
:root {
  /* single dark look on purpose: it matches the app's own dark theme */
  color-scheme: dark;
  --ground: #0b120e;
  --panel: #131d17;
  --line: #24352b;
  --ink: #eef5f0;
  --mute: #8fa597;
  --acc: #3ddc84;
  --gold: #f2c14e;
  --display: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --body: 'Sora', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink); font: 15px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; padding-block: 40px 56px; display: grid; gap: 28px; }
header { display: grid; gap: 8px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 40px; height: 40px; flex: none; }
h1 { font: 800 clamp(26px, 5vw, 38px)/1.1 var(--display); margin: 0; letter-spacing: -.02em; text-wrap: balance; }
h1 span { color: var(--acc); }
.lede { color: var(--mute); margin: 0; max-width: 60ch; }

.stage { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 40px; align-items: start; }
@media (max-width: 760px) { .stage { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 20px; } }

/* the phone */
.phone {
  position: relative; width: 300px; max-width: 100%; aspect-ratio: 287 / 621; border-radius: 40px; padding: 10px;
  background: linear-gradient(160deg, #26332b, #0f1612); box-shadow: 0 30px 80px #0009, inset 0 0 0 1px #3a4d41;
}
.screen { position: relative; width: 100%; height: 100%; border-radius: 30px; overflow: hidden; background: #0d1511; }
.screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; opacity: 0; transition: opacity .45s ease; }
.screen img.on { opacity: 1; }
.notch { position: absolute; top: 18px; left: 50%; width: 76px; height: 6px; margin-left: -38px; border-radius: 6px; background: #000a; z-index: 2; }
.bar { position: absolute; left: 22px; right: 22px; bottom: -18px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--acc); }

/* the script */
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: s; }
.steps button {
  width: 100%; text-align: left; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 2px 12px; padding: 12px 14px;
  background: transparent; color: var(--mute); border: 1px solid transparent; border-radius: 14px; font: inherit; cursor: pointer;
}
.steps button::before { counter-increment: s; content: counter(s); grid-row: span 2; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font: 700 12px var(--display); background: var(--panel); color: var(--mute); border: 1px solid var(--line); }
.steps b { color: var(--ink); font: 600 15px/1.35 var(--display); }
.steps small { font-size: 13.5px; line-height: 1.5; display: none; }
.steps button:hover { background: var(--panel); }
.steps button[aria-current="step"] { background: var(--panel); border-color: var(--line); }
.steps button[aria-current="step"]::before { background: var(--acc); color: #06110b; border-color: var(--acc); }
.steps button[aria-current="step"] small { display: block; color: var(--mute); }
.steps button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

.controls { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
.controls button { font: 600 13px var(--display); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.controls button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.controls .count { margin-left: auto; color: var(--mute); font-size: 12px; font-variant-numeric: tabular-nums; }

footer { border-top: 1px solid var(--line); padding-top: 18px; color: var(--mute); font-size: 13px; display: flex; flex-wrap: wrap; gap: 8px 20px; }
footer b { color: var(--ink); font-weight: 600; }
footer a { color: var(--acc); }
.cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 6px; }
.cta { display: inline-block; background: var(--acc); color: #06110b; font: 800 16px var(--display); text-decoration: none; padding: 12px 22px; border-radius: 14px; }
.cta:hover { filter: brightness(1.05); }
.cta:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.cta-row span { color: var(--mute); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .screen img { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0d1511"/><path d="M4 50 L9 33 L13 29.5 L33 29 L39 26 L44 19.5 Q48 16 52 19 L55 26 L60 50 Z" fill="#6f8597"/><path d="M4 50 L9 33 L13 35 L40 31 L22 50 Z" fill="#4f6474"/><path d="M9 33 L13 29.5 L33 29 L39 26 L44 19.5 Q48 16 52 19 L55 26 L53 28.5 L45 26.5 L40 31 L13 35 Z" fill="#c9d6df"/></svg>
      <h1>Bluies <span>Finest</span></h1>
    </div>
    <p class="lede">Hangboard accountability and bragging rights.</p>
    <div class="cta-row"><a class="cta" href="https://hangboarding.github.io/bluies-finest/#join">Sign up</a><span>You’ll need an invite code from whoever invited you.</span></div>
  </header>

  <section class="stage" aria-label="App walkthrough">
    <div>
      <div class="phone" id="phone">
        <div class="notch"></div>
        <div class="screen" id="screen"></div>
        <div class="bar" aria-hidden="true"><i id="prog"></i></div>
      </div>
    </div>
    <div>
      <ol class="steps" id="steps"></ol>
      <div class="controls">
        <button id="prev" aria-label="Previous step">← Back</button>
        <button id="play" aria-label="Pause the tour">Pause</button>
        <button id="next" aria-label="Next step">Next →</button>
        <span class="count" id="count"></span>
      </div>
    </div>
  </section>

  <footer>
    <span><b>Works best installed:</b> Share → Add to Home Screen (iPhone) or ⋮ → Install app (Android).</span>
    <span>Already have an account? <a href="https://hangboarding.github.io/bluies-finest/">Sign in</a></span>
  </footer>
</div>

<script>
const STEPS = [
  ['02-setup.jpg', 'Pick a protocol', 'Max Hangs, Repeaters, Abrahangs, 7/53 and more, each with who came up with it and how often to do it. Or save your own, or just hit “Just let me hang”.'],
  ['03-timer.jpg', 'Hang', 'It counts you in, beeps near the end of each hang and times your rests. Tap “Let go” if you drop off early. Your screen won’t go to sleep mid-set.'],
  ['04-done.jpg', 'Log it', 'See your time on the board and points, then say how hard it felt. If it was easy, it bumps the weight up next time. No reception? It saves and uploads later.'],
  ['05-activity.jpg', 'See what everyone’s doing', 'A shared monthly goal, a recap of last week, and everyone’s sessions to like and comment on.'],
  ['06-ranks.jpg', 'Ranks', 'Each season (summer, autumn, winter, spring) has its own leaderboard, and whoever has the most points at the end takes the title. There are also boards for strength, grip types and consistency.'],
  ['07-stats.jpg', 'Your stats', 'Streak, rank, favourite protocol, a calendar of when you trained, personal bests and how you’re tracking over time.'],
  ['08-achievements.jpg', 'Badges', 'Badges level up from Iron all the way to GOAT. There are a few one-off and secret ones too.'],
  ['09-notifications.jpg', 'Notifications', 'You’ll see when someone likes or comments on a session, in the app or as a phone notification.'],
  ['10-climber.jpg', 'Check out other climbers', 'Tap anyone to see their sessions, streak, PBs and badges. Personal details stay hidden.'],
];
const SLIDE_MS = 4500;
const screen = document.getElementById('screen'), list = document.getElementById('steps'), prog = document.getElementById('prog');
const playBtn = document.getElementById('play'), count = document.getElementById('count');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let i = 0, playing = !reduce, t0 = performance.now(), raf = 0;

STEPS.forEach(([src, title, text], k) => {
  const img = new Image(); img.src = src; img.alt = `${title}: app screen`; img.loading = k < 2 ? 'eager' : 'lazy'; screen.append(img);
  const li = document.createElement('li');
  li.innerHTML = `<button type="button" data-k="${k}"><b>${title}</b><small>${text}</small></button>`;
  list.append(li);
});
const imgs = [...screen.children], btns = [...list.querySelectorAll('button')];

function show(k) {
  i = (k + STEPS.length) % STEPS.length;
  imgs.forEach((im, n) => im.classList.toggle('on', n === i));
  btns.forEach((b, n) => b.setAttribute('aria-current', n === i ? 'step' : 'false'));
  count.textContent = `${i + 1} / ${STEPS.length}`;
  t0 = performance.now(); prog.style.width = '0%';
}
function tick(now) {
  if (playing) {
    const p = Math.min(1, (now - t0) / SLIDE_MS);
    prog.style.width = `${p * 100}%`;
    if (p >= 1) show(i + 1);
  }
  raf = requestAnimationFrame(tick);
}
function setPlaying(on) {
  playing = on; playBtn.textContent = on ? 'Pause' : 'Play';
  playBtn.setAttribute('aria-label', on ? 'Pause the tour' : 'Play the tour');
  if (on) t0 = performance.now() - (parseFloat(prog.style.width) || 0) / 100 * SLIDE_MS;
}

list.addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) { show(+b.dataset.k); } });
document.getElementById('prev').onclick = () => show(i - 1);
document.getElementById('next').onclick = () => show(i + 1);
playBtn.onclick = () => setPlaying(!playing);
document.getElementById('phone').addEventListener('click', () => show(i + 1));
addEventListener('keydown', e => { if (e.key === 'ArrowRight') show(i + 1); if (e.key === 'ArrowLeft') show(i - 1); if (e.key === ' ' && e.target === document.body) { e.preventDefault(); setPlaying(!playing); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) t0 = performance.now() - (parseFloat(prog.style.width) || 0) / 100 * SLIDE_MS; });

show(0); setPlaying(playing); raf = requestAnimationFrame(tick);
</script>

</body>
</html>
