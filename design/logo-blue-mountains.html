<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blue Mountains logos</title>
<style>
:root{--bg:#0d1511;--card:#16211b;--line:#2a3b31;--ink:#eef5f0;--mute:#8fa597;--acc:#3ddc84}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding:16px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mute);font-size:13px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;max-width:1200px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:center;position:relative}
.tag{position:absolute;top:10px;left:12px;font-weight:800;color:var(--acc);font-size:13px}
.opt h2{font-size:15px;margin:8px 0 2px}.opt p{color:var(--mute);font-size:12.5px;margin:0}
.big{width:128px;height:128px}.row{display:flex;gap:10px;justify-content:center;align-items:end;margin-top:8px}
.row svg:nth-child(1){width:48px;height:48px}.row svg:nth-child(2){width:32px;height:32px}.row svg:nth-child(3){width:16px;height:16px}
</style>
</head>
<body>
<h1>Blue Mountains logo options</h1>
<p class="sub">Mt Solitary and the Ruined Castle: flat-topped, cliff-banded sandstone. Shown at 128, 48, 32 and 16px.</p>
<div class="grid" id="g"></div>

<template id="t">
<!-- 1 Solitary profile -->
<svg data-n="Solitary profile" data-d="Long mesa rising to the dome at the east end, pale cliff band on a darker forested slope." viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0d1511"/><path d="M5 50 L9 33 L13 30 L30 29.5 L36 28 L42 21 Q47 16.5 52 20 L55 27 L59 50 Z" fill="#6f8597"/><path d="M9 33 L13 30 L30 29.5 L36 28 L42 21 Q47 16.5 52 20 L55 27 L52 29 L44 27 L38 32 L28 34 L12 36 Z" fill="#c9d6df"/></svg>

<!-- 2 Strata -->
<svg data-n="Strata" data-d="Mt Solitary with horizontal sedimentary lines cut through the cliff band." viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0d1511"/><defs><clipPath id="c2"><path d="M8 34 L12 28 L36 27 L44 18 Q48 15 52 18 L56 30 L56 38 L8 38 Z"/></clipPath></defs><path d="M4 50 L8 34 L12 28 L36 27 L44 18 Q48 15 52 18 L56 30 L60 50 Z" fill="#6f8597"/><g clip-path="url(#c2)"><rect x="0" y="14" width="64" height="24" fill="#97abbb"/><path d="M0 24h64M0 29h64M0 33.5h64" stroke="#6f8597" stroke-width="1.4"/></g><path d="M4 50 L60 50" stroke="#0d1511" stroke-width="0"/></svg>

<!-- 3 Ruined Castle stack -->
<svg data-n="Castle stack" data-d="The Ruined Castle pinnacle: stacked sandstone blocks with the overhanging capstone." viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0d1511"/><path d="M22 10 h16 v5 h-3 v4 h4 v10 h3 v21 h-26 v-17 h3 v-11 h3 v-7 h-3 z" fill="#97abbb"/><path d="M22 15 h16 M25 20 h12 M23 29 h17 M20 38 h22" stroke="#0d1511" stroke-width="1.6"/><path d="M32 19 v10 h8 v21 h-8 z" fill="#6f8597" opacity=".55"/></svg>

<!-- 4 Castle + Solitary -->
<svg data-n="Castle and Solitary" data-d="The view from the Ruined Castle: pinnacle in front, Solitary's cliffs behind." viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0d1511"/><path d="M26 50 L30 34 L34 31 L48 30 L52 24 Q55 22 57 25 L60 50 Z" fill="#4f6474"/><path d="M30 34 L34 31 L48 30 L52 24 Q55 22 57 25 L58 32 L34 35 Z" fill="#6f8597"/><path d="M9 14 h12 v4 h-2 v6 h3 v26 h-16 v-20 h2 v-12 h1 z" fill="#c9d6df"/><path d="M9 18 h12 M8 30 h14 M6 40 h17" stroke="#0d1511" stroke-width="1.5"/></svg>

<!-- 5 Sunset escarpment -->
<svg data-n="Sunset cliffs" data-d="Golden-hour light on the cliff line (photo 1), grey forest below." viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0d1511"/><path d="M4 50 L10 30 L16 26 L46 25 L52 28 L60 50 Z" fill="#6f8597"/><path d="M12 28 L16 24 L22 23 L26 25 L32 23 L40 24 L46 22 L52 26 L50 31 L14 32 Z" fill="#e8955a"/><path d="M14 28.5 h36" stroke="#c46a37" stroke-width="1.3"/></svg>

<!-- 6 Receding ridges -->
<svg data-n="Layered plateaus" data-d="Three flat-topped ridges fading into the blue haze." viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0d1511"/><path d="M4 30 L10 24 L28 24 L32 22 L44 22 L48 26 L60 26 V50 H4Z" fill="#3c4d5a"/><path d="M4 38 L14 32 L40 32 L44 29 L52 29 L58 34 L60 34 V50 H4Z" fill="#6f8597"/><path d="M4 46 L8 41 L30 40 L36 38 L60 38 V50 H4Z" fill="#c9d6df"/></svg>

<!-- 7 Edge (hangboard pun) -->
<svg data-n="The edge" data-d="A cliff band whose top lip reads as a hangboard edge; mesa above, talus below." viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0d1511"/><path d="M8 26 L14 20 L50 20 L56 26 Z" fill="#6f8597"/><rect x="8" y="26" width="48" height="12" fill="#c9d6df"/><path d="M8 31.5 h48" stroke="#97abbb" stroke-width="1.4"/><path d="M8 38 L56 38 L60 50 L4 50 Z" fill="#4f6474"/></svg>

<!-- 8 Badge -->
<svg data-n="Round badge" data-d="Mt Solitary inside a circle with strata lines, for a stamp-like mark." viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0d1511"/><circle cx="32" cy="32" r="24" fill="#1c2a33"/><clipPath id="c8"><circle cx="32" cy="32" r="24"/></clipPath><g clip-path="url(#c8)"><path d="M4 56 L12 34 L16 31 L34 30 L40 24 Q45 20 49 24 L54 33 L60 56 Z" fill="#6f8597"/><path d="M12 34 L16 31 L34 30 L40 24 Q45 20 49 24 L54 33 L50 35 L14 37 Z" fill="#c9d6df"/><path d="M13 34.5 h40" stroke="#97abbb" stroke-width="1.2"/></g><circle cx="32" cy="32" r="24" fill="none" stroke="#97abbb" stroke-width="2"/></svg>

<!-- 9 Stacked blocks -->
<svg data-n="Stacked strata" data-d="Abstract mesa built from offset sandstone layers, rounded block corners." viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0d1511"/><rect x="18" y="16" width="26" height="7" rx="2" fill="#c9d6df"/><rect x="13" y="25" width="36" height="7" rx="2" fill="#97abbb"/><rect x="9" y="34" width="44" height="7" rx="2" fill="#6f8597"/><rect x="5" y="43" width="54" height="7" rx="2" fill="#4f6474"/></svg>

<!-- 10 Line art -->
<svg data-n="Line drawing" data-d="Single-weight outline of Solitary with two strata lines; light and quiet." viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0d1511"/><g fill="none" stroke="#c9d6df" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><path d="M6 48 L11 32 L15 28 L34 27.5 L41 20 Q46 15.5 51 19 L54 28 L58 48"/><path d="M12 33 L52 31" stroke="#97abbb" stroke-width="1.8"/><path d="M18 38 L48 37" stroke="#6f8597" stroke-width="1.8"/></g></svg>
</template>

<script>
const g=document.getElementById('g');
[...document.getElementById('t').content.querySelectorAll('svg')].forEach((s,i)=>{
  const d=document.createElement('div');d.className='opt';
  const big=s.cloneNode(true);big.classList.add('big');
  const row=document.createElement('div');row.className='row';
  for(let k=0;k<3;k++)row.appendChild(s.cloneNode(true));
  d.innerHTML=`<span class="tag">${i+1}</span>`;
  d.append(big,row);
  d.insertAdjacentHTML('beforeend',`<h2>${s.dataset.n}</h2><p>${s.dataset.d}</p>`);
  g.appendChild(d);
});
</script>
</body>
</html>
