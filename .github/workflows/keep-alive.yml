name: Keep Supabase awake

# Free Supabase projects pause after about 7 days with no activity.
# This makes one small read-only database call twice a week so that never happens.
# It runs twice a week, not once, because GitHub can start scheduled runs hours late.

on:
  schedule:
    - cron: '17 9 * * 1,4' # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          url="${SUPABASE_URL%/}/rest/v1/rpc/check_invite_code"
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$url" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"KEEPALIVE"}')
          echo "HTTP $status: $(cat response.txt)"
          test "$status" = 200
